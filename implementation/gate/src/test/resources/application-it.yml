spring:
  datasource:
    control:
      driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
      jdbc-url: jdbc:tc:postgresql:18:///test?user=efti&TC_INITSCRIPT=sql/init-test-schema.sql
      url: jdbc:tc:postgresql:18:///test?user=efti&TC_INITSCRIPT=sql/init-test-schema.sql
      liquibase:
        change-log: classpath:db/changelog/db.test.changelog-master.xml
        default-schema: "eftiit"
    identifiers:
      driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
      jdbc-url: jdbc:tc:postgresql:18:///test?user=efti&TC_INITSCRIPT=sql/init-test-schema.sql
      url: jdbc:tc:postgresql:18:///test?user=efti&TC_INITSCRIPT=sql/init-test-schema.sql
      liquibase:
        enabled: false
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        control_schema: "eftiit"
        identifiers_schema: "eftiit"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost

batch:
  update:
    cron: "0 */1 * ? * *"

gate:
  owner: gate-it
  country: IT

logging:
  level:
    eu.efti.eftigate.testsupport.TestDataRandomSeedResettingTestExecutionListener: TRACE
    reactor.netty.http.client: DEBUG
