services:
  mysql-sybo:
    image: mysql:8.0
    restart: always
    healthcheck:
      # Wait until the Domibus schemas have been created and seeded
      test: "test -f /var/lib/mysql/.domibus-init-done && mysqladmin ping -h 127.0.0.1 --silent"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 30s
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3306:3306'
    volumes:
      - ./db/sybo/initdb.d:/docker-entrypoint-initdb.d/
      - ./db/sybo/data:/var/lib/mysql:Z
    networks:
      efti:

  mysql-li:
    image: mysql:8.0
    restart: always
    healthcheck:
      # Wait until the Domibus schemas have been created and seeded
      test: "test -f /var/lib/mysql/.domibus-init-done && mysqladmin ping -h 127.0.0.1 --silent"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 30s
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3307:3306'
    volumes:
      - ./db/li/initdb.d:/docker-entrypoint-initdb.d/
      - ./db/li/data:/var/lib/mysql:Z
    networks:
      efti:

  mysql-platform:
    image: mysql:8.0
    restart: always
    healthcheck:
      # Wait until the Domibus schemas have been created and seeded
      test: "test -f /var/lib/mysql/.domibus-init-done && mysqladmin ping -h 127.0.0.1 --silent"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 30s
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3308:3306'
    volumes:
      - ./db/platform/initdb.d:/docker-entrypoint-initdb.d/
      - ./db/platform/data:/var/lib/mysql:Z
    networks:
      efti:

  domibus-sybo:
    build:
      context: ./
      dockerfile: Dockerfile
    tty: true
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./domibus/sybo/domains/syldavia/:/opt/domibus/conf/domibus/domains/syldavia/
      - ./domibus/sybo/domains/borduria/:/opt/domibus/conf/domibus/domains/borduria/
      - ./domibus/sybo/domibus-sybo.properties:/opt/domibus/conf/domibus/domibus.properties
      - ./domibus/sh/setenv-node-1.sh:/opt/domibus/bin/setenv.sh
      - ./domibus/sybo/plugins-conf/:/opt/domibus/conf/domibus/plugins/config/domains/
      - ./domibus/ca_cert:/opt/domibus/conf/ca_cert/
    depends_on:
      mysql-sybo:
        condition: service_healthy
      activemq-sybo:
        condition: service_started
    networks:
      efti:

  domibus-li:
    build:
      context: ./
      dockerfile: Dockerfile
    tty: true
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./domibus/li/domains/listenbourg/:/opt/domibus/conf/domibus/domains/listenbourg/
      - ./domibus/li/domibus-li.properties:/opt/domibus/conf/domibus/domibus.properties
      - ./domibus/sh/setenv-node-1.sh:/opt/domibus/bin/setenv.sh
      - ./domibus/li/plugins-conf/:/opt/domibus/conf/domibus/plugins/config/domains/
      - ./domibus/ca_cert:/opt/domibus/conf/ca_cert/
    depends_on:
      mysql-li:
        condition: service_healthy
      activemq-li:
        condition: service_started
    networks:
      efti:

  domibus-platform:
    build:
      context: ./
      dockerfile: Dockerfile
    tty: true
    ports:
      - "8100:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./domibus/platform/domains/acme/:/opt/domibus/conf/domibus/domains/acme/
      - ./domibus/platform/domains/massivedynamic/:/opt/domibus/conf/domibus/domains/massivedynamic/
      - ./domibus/platform/domains/umbrellacorporation/:/opt/domibus/conf/domibus/domains/umbrellacorporation/
      - ./domibus/platform/domibus-platform.properties:/opt/domibus/conf/domibus/domibus.properties
      - ./domibus/sh/setenv-node-1.sh:/opt/domibus/bin/setenv.sh
      - ./domibus/platform/plugins-conf/:/opt/domibus/conf/domibus/plugins/config/domains/
      - ./domibus/ca_cert:/opt/domibus/conf/ca_cert/
    depends_on:
      mysql-platform:
        condition: service_healthy
      activemq-platform:
        condition: service_started
    networks:
      efti:

  activemq-sybo:
    image: webcenter/activemq:latest
    ports:
      - "8161:8161"
    environment:
      - ACTIVEMQ_NAME=activemq
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=password
    networks:
      efti:

  activemq-li:
    image: webcenter/activemq:latest
    ports:
      - "8162:8161"
    environment:
      - ACTIVEMQ_NAME=activemq
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=password
    networks:
      efti:

  activemq-platform:
    image: webcenter/activemq:latest
    ports:
      - "8163:8161"
    environment:
      - ACTIVEMQ_NAME=activemq
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=password
    networks:
      efti:

  nginx:
    image: nginx:latest
    ports:
      - "81:81"
      - "82:82"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      efti:
        aliases:
          - efti.gate.syldavia.eu
          - efti.gate.borduria.eu
          - efti.gate.listenbourg.eu
          - efti.platform.massivedynamic.com
          - efti.platform.acme.com
          - efti.platform.umbrellainc.com

networks:
  efti:
    name: efti-network
    external: true
