# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: implementation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: implementation/**/pom.xml

      - name: Show environment info
        run: |
          echo "== java -version =="
          java -version
          echo "== mvn -version =="
          mvn -version
          echo "== df -h =="
          df -h
          echo "== free -h =="
          free -h || true

      - name: Build and test with Maven
        run: |
          mkdir -p /tmp/diagnostics
          mvn --batch-mode --errors verify -Ddependency-check.skip=true \
            -Dsurefire.printSummary=true -Dmaven.test.redirectTestOutputToFile=false &
          MVN_PID=$!

          # Heartbeat + thread dumps every minute so a hang shows up in the logs
          # even if the job is killed by the workflow timeout before mvn finishes.
          (
            while kill -0 "$MVN_PID" 2>/dev/null; do
              sleep 60
              {
                echo "=== heartbeat $(date -u +%FT%TZ) ==="
                jps -l || true
                for pid in $(jps -q); do
                  echo "--- jstack $pid ---"
                  jstack "$pid" 2>/dev/null || true
                done
              } | tee -a /tmp/diagnostics/thread-dumps.log
            done
          ) &
          WATCHDOG_PID=$!

          wait "$MVN_PID"
          MVN_EXIT=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit $MVN_EXIT

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: implementation/**/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload thread dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thread-dumps
          path: /tmp/diagnostics/thread-dumps.log
          if-no-files-found: ignore
